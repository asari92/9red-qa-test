name: Playwright tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      browser:
        description: "Which browsers to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - chromium
          - firefox

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: playwright/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: |
          echo "Selected browser: ${{ github.event_name == 'workflow_dispatch' && inputs.browser || 'all (PR)' }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.browser }}" != "all" ]; then
            npx playwright install --with-deps ${{ inputs.browser }}
          else
            npx playwright install --with-deps
          fi
        shell: bash


      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.browser }}" != "all" ]; then
            echo "Running: ${{ inputs.browser }}"
            npx playwright test --project=${{ inputs.browser }}
          else
            echo "Running: all projects"
            npx playwright test
          fi
        shell: bash

      - name: Summary
        if: always()
        run: |
          echo "### Run parameters" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "- browser: ${{ inputs.browser }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "- browser: all (PR)" >> $GITHUB_STEP_SUMMARY
          fi
        shell: bash

