name: Playwright tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      browser:
        description: "Which browsers to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - chromium
          - firefox

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: playwright/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.browser }}" != "all" ]; then
            npx playwright test --project=${{ inputs.browser }}
          else
            npx playwright test
          fi
        shell: bash
